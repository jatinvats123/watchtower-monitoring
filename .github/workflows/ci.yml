name: CI

on:
  # `push` is deliberately restricted to main. Combined with `pull_request`,
  # every commit is validated exactly ONCE in each context.
  #
  # The previous `branches: ['**']` meant a commit on a PR branch triggered two
  # runs — one for the push, one for the pull request — of the same workflow on
  # the same SHA. That doubled CI minutes, and worse, both runs exported to the
  # same `type=gha` Docker layer cache simultaneously and raced each other: the
  # image build failed in the pull_request run while passing in the push run,
  # for identical code. A build whose result depends on what else is running is
  # not a signal anyone can act on.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches, but NEVER on main.
  #
  # On a branch, only the latest commit matters and cancelling saves minutes.
  # On main every commit's result is a permanent record: it is what the README
  # badge reports and what a reader uses to judge whether the project builds.
  # A cancelled run leaves the badge red with nothing actually broken — which is
  # exactly what happened when a merge landed while another main run was in
  # flight.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Every job installs from the lockfile; nothing here should ever reach out
  # for a newer version than was resolved.
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install
        run: |
          npm ci --prefix Backend
          npm ci --prefix Frontend
          npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        # Formatting drift is cheap to prevent and tedious to review.
        run: npm run format:check

  # ---------------------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel Node 22 because Node 20 failed — knowing whether a
      # failure is version-specific is the entire point of a matrix.
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install
        run: npm ci --prefix Backend

      - name: Cache mongodb-memory-server binary
        # Otherwise every job re-downloads a ~100MB mongod.
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test with coverage
        # The 60% statement gate lives in jest.config.js, so this step fails on
        # a coverage regression as well as on a failing test.
        run: npm run test:coverage --prefix Backend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node }}
          path: Backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  security:
    name: Dependency & filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install
        run: |
          npm ci --prefix Backend
          npm ci --prefix Frontend

      - name: Dependency audit gate
        # Fails on any high/critical advisory that is not explicitly
        # allowlisted with a justification and a review date. See
        # scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs Backend Frontend

      - name: Trivy filesystem scan
        # Run through the official container rather than the marketplace action.
        #
        # The action wraps the same binary but adds input plumbing that behaved
        # differently here than locally — the ignore file silently did not
        # apply, so a scan that was clean on a laptop failed on the runner. A
        # gate whose behaviour depends on where it runs is not a gate. This is
        # byte-for-byte the command used in development.
        #
        # The findings are also echoed into the job summary and as annotations,
        # so a failure is legible without opening the raw log.
        env:
          # Trivy's default database lives on ghcr.io, which rate-limits
          # anonymous pulls. On a busy runner that surfaces as a scan failure
          # with nothing wrong in the code, and the natural response to that is
          # to re-run rather than read it. The ECR mirror is not rate limited.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          set +e
          docker run --rm \
            -e TRIVY_DB_REPOSITORY \
            -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest fs . \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --ignorefile .trivyignore \
              --exit-code 1 \
              --format table 2>&1 | tee /tmp/trivy-fs.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### Trivy — filesystem"
            echo ''
            echo '```'
            tail -60 /tmp/trivy-fs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            grep -E 'CVE-|GHSA-' /tmp/trivy-fs.txt | head -20 \
              | while read -r line; do echo "::error title=Trivy (filesystem)::$line"; done
            exit 1
          fi
          echo "no blocking vulnerabilities"

  # ---------------------------------------------------------------------------
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        run: npm ci --prefix Frontend

      - name: Build SPA
        run: npm run build

      - name: Fail if the bundle is empty
        # A "successful" build that emitted nothing would otherwise sail
        # through and only be noticed as a blank page in production.
        run: |
          test -f Backend/public/dist/index.html
          echo "bundle size: $(du -sh Backend/public/dist | cut -f1)"

  # ---------------------------------------------------------------------------
  docker:
    name: Build & scan images
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Layer caches are READ from this ref and from main, but WRITTEN only to
      # this ref's own scope.
      #
      # An unscoped `type=gha` means every concurrent run exports to the same
      # cache key. Two runs building the same image at once then corrupt each
      # other's export, which surfaces as an image build that fails in one run
      # and passes in another for identical code. Separate write scopes make
      # that impossible; reading main's scope keeps the cache hit rate.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Backend/Dockerfile
          tags: watchtower-backend:ci
          load: true
          cache-from: |
            type=gha,scope=backend-${{ github.ref_name }}
            type=gha,scope=backend-main
          cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: Frontend/Dockerfile
          tags: watchtower-frontend:ci
          load: true
          cache-from: |
            type=gha,scope=frontend-${{ github.ref_name }}
            type=gha,scope=frontend-main
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}

      - name: Assert images do not run as root
        # The single most common container hardening regression, and trivially
        # cheap to assert.
        run: |
          for image in watchtower-backend:ci watchtower-frontend:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            echo "$image runs as: ${user:-root}"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image would run as root"
              exit 1
            fi
          done

      - name: Report image sizes
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep watchtower | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Trivy image scan (backend)
        # Same reasoning as the filesystem scan: the official container, the
        # exact command used in development.
        #
        # The image is exported to a tar and scanned with --input rather than
        # scanned by name. That avoids mounting the Docker socket into the
        # scanner — a container with the host socket can do anything to the
        # host, which is a large privilege to hand a tool for no benefit.
        #
        # `--ignore-unfixed` because an OS advisory with no published fix is not
        # actionable here; bumping the base image is Dependabot's job, not a
        # reason to block every pull request.
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          docker save watchtower-backend:ci -o /tmp/backend-image.tar

          set +e
          docker run --rm \
            -e TRIVY_DB_REPOSITORY \
            -v /tmp:/scan -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest image --input /scan/backend-image.tar \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --ignorefile .trivyignore \
              --exit-code 1 \
              --format table 2>&1 | tee /tmp/trivy-image.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### Trivy — backend image"
            echo ''
            echo '```'
            tail -60 /tmp/trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            grep -E 'CVE-|GHSA-' /tmp/trivy-image.txt | head -20 \
              | while read -r line; do echo "::error title=Trivy (image)::$line"; done
            exit 1
          fi
          echo "no blocking vulnerabilities"

  # ---------------------------------------------------------------------------
  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        # Exercises the real topology: compose waits for Mongo to be HEALTHY
        # before the backend starts (depends_on: condition: service_healthy).
        run: docker compose up -d --build

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/health did not return 200 within 60s"
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - name: Assert readiness reports its dependencies
        # Readiness must actually check MongoDB, not just return 200 — the whole
        # point is that it fails when a dependency does.
        run: |
          body=$(curl -s http://localhost:8000/api/health/ready)
          echo "$body" | jq .
          echo "$body" | jq -e '.data.status == "ready"' > /dev/null
          echo "$body" | jq -e '.data.checks.mongodb.status == "up"' > /dev/null
          echo "$body" | jq -e '.data.checks.scheduler' > /dev/null

      - name: Assert Prometheus metrics are exposed
        # Proves the scrape endpoint survives the SPA fallback and that the
        # metrics the runbook alerts on actually exist.
        run: |
          curl -sf http://localhost:8000/metrics -o /tmp/metrics.txt
          for metric in \
            watchtower_checks_executed_total \
            watchtower_check_duration_seconds \
            watchtower_incidents_opened_total \
            watchtower_notification_failures_total \
            watchtower_scheduler_lag_seconds \
            watchtower_http_requests_total; do
            grep -q "$metric" /tmp/metrics.txt \
              || { echo "::error::$metric missing from /metrics"; exit 1; }
          done
          echo "all runbook metrics present ($(wc -l < /tmp/metrics.txt) lines)"

      - name: Assert requests are correlatable
        # Every response must carry an id that also appears in the logs;
        # without it a 500 in the log stream is an orphan.
        run: |
          id=$(curl -sI http://localhost:8000/api/health | tr -d '\r' \
                | awk -F': ' 'tolower($1)=="x-request-id"{print $2}')
          echo "X-Request-Id: ${id:-<none>}"
          test -n "$id"

      - name: Assert logs are structured JSON on stdout
        # Regression guard: the console transport was previously disabled in
        # production, so the deployed service logged nowhere the platform could
        # see.
        run: |
          docker compose logs backend --no-log-prefix 2>/dev/null \
            | grep -c '"level":' > /tmp/jsonlines || true
          count=$(cat /tmp/jsonlines)
          echo "structured log lines: $count"
          test "$count" -gt 0

      - name: Assert the SPA is served
        # The backend serves the bundle it built itself; a 200 here proves the
        # multi-stage frontend build actually landed in the image.
        run: |
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://localhost:8000/)
          test "$code" = "200"
          grep -qi '<div id="root"' /tmp/index.html
          echo "SPA shell served ($(wc -c < /tmp/index.html) bytes)"

      - name: Assert unauthenticated API access is rejected
        # Cheap end-to-end proof that auth is wired in the built image, not just
        # in the unit tests.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/monitor)
          echo "GET /api/monitor (no token) -> $code"
          test "$code" = "401"

      - name: Assert graceful shutdown
        # dumb-init must forward SIGTERM so the scheduler drains and releases
        # its lease. Without it npm swallowed the signal and every deploy left
        # monitoring paused until the lease expired.
        run: |
          docker compose stop -t 30 backend
          docker compose logs backend | tail -40
          docker compose logs backend | grep -q 'received SIGTERM' \
            || { echo "::error::SIGTERM never reached the app"; exit 1; }
          docker compose logs backend | grep -q 'clean exit' \
            || { echo "::error::shutdown did not complete cleanly"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  coverage-badge:
    name: Refresh coverage badge
    runs-on: ubuntu-latest
    needs: [test]
    # main only: the badge should reflect what is released, not whatever a
    # feature branch happens to be at.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage-node-20
          path: Backend/coverage

      - name: Generate badge from the real summary
        run: node scripts/coverage-badge.mjs

      - name: Commit if it changed
        # continue-on-error: a protected branch that refuses the push must not
        # fail the build. The badge is a convenience; the coverage GATE is the
        # thing that actually enforces anything.
        continue-on-error: true
        run: |
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "badge unchanged"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/badges/coverage.json
          git commit -m 'ci(badge): refresh coverage badge [skip ci]'
          git push

  # ---------------------------------------------------------------------------
  ci-ok:
    # Single required status check, so branch protection does not need updating
    # every time a job is added or renamed.
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, docker, integration]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
          echo "all jobs passed"
